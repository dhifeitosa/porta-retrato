<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>Porta-retrato</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
/* VOICE quiet and domestic, like a phone lock screen
   IDEA a framed photograph on the sideboard with the time etched on glass
   PICTURE the photo itself, full bleed, still, soft crossfade
   COLOUR black ground, white type, frosted glass, one blue for actions
   TYPE Inter 200 for the clock, 400 and 500 for labels
   LAYOUT date and time bottom left on a soft scrim, weather glass pill bottom right, settings sheet on tap */
:root{color-scheme:dark;--ink:#fff;--soft:rgba(255,255,255,.74);--glass:rgba(28,28,32,.38);--line:rgba(255,255,255,.18)}
*{box-sizing:border-box;min-width:0;margin:0}
html,body{height:100%;background:#000;color:var(--ink);font:16px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
.stage{position:fixed;inset:0}
.empty{position:absolute;inset:0;background:radial-gradient(120% 90% at 18% 8%,#33476a 0,#131a29 52%,#05060a 100%)}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 2.5s cubic-bezier(.45,0,.2,1);overflow:hidden;will-change:opacity}
.slide.on{opacity:1}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%}
.scrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.62) 0,rgba(0,0,0,.26) 34%,rgba(0,0,0,0) 60%),linear-gradient(to bottom,rgba(0,0,0,.22),rgba(0,0,0,0) 18%)}
.night{position:absolute;inset:0;background:#000;opacity:0;transition:opacity 3s;pointer-events:none}
body.is-night .night{opacity:.86}
.hud{position:absolute;left:max(4.5vw,env(safe-area-inset-left));right:max(4.5vw,env(safe-area-inset-right));bottom:max(5.5vh,env(safe-area-inset-bottom));display:flex;align-items:flex-end;justify-content:space-between;gap:24px;pointer-events:none;text-shadow:0 1px 18px rgba(0,0,0,.35);transition:opacity 3s}
body.is-night .hud{opacity:.5}
.date{font-weight:500;font-size:clamp(18px,2.4vw,30px);color:var(--soft);margin-bottom:.2em}
.time{font-weight:200;font-size:clamp(88px,15vw,210px);line-height:.92;letter-spacing:-.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
.wx{display:flex;align-items:center;gap:16px;padding:14px 24px 14px 16px;border-radius:28px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);text-shadow:none;flex:none}
.wx[hidden]{display:none}
.wx svg{width:clamp(42px,4.6vw,58px);height:auto;flex:none}
.wx b{display:block;font-weight:300;font-size:clamp(34px,4vw,52px);line-height:1;margin-bottom:4px}
.wx small{display:block;font-size:clamp(13px,1.3vw,16px);color:var(--soft);white-space:nowrap}
.gear{position:absolute;top:max(20px,env(safe-area-inset-top));right:max(20px,env(safe-area-inset-right));width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;display:grid;place-items:center;opacity:0;transition:opacity .4s;pointer-events:none;cursor:pointer}
body.show-ui .gear{opacity:1;pointer-events:auto}
.hint{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;color:var(--soft);font-size:clamp(17px,1.8vw,22px);width:min(560px,86vw)}
.hint[hidden]{display:none}
.hint strong{display:block;color:#fff;font-weight:500;font-size:clamp(22px,2.6vw,32px);margin-bottom:8px}
.hint .btn{width:auto;display:inline-flex;padding:0 30px;margin:22px 0 0}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);padding:max(24px,env(safe-area-inset-top)) 22px 28px;background:rgba(20,20,24,.74);backdrop-filter:blur(30px) saturate(1.4);-webkit-backdrop-filter:blur(30px) saturate(1.4);border-left:1px solid var(--line);transform:translateX(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);overflow-y:auto;user-select:auto}
body.open .sheet{transform:none}
.sheet h2{font-weight:500;font-size:26px;margin-bottom:4px}
.sub{color:var(--soft);font-size:14px;margin-bottom:22px}
.cap{color:var(--soft);font-size:13px;margin:0 6px 8px}
.grp{background:rgba(255,255,255,.07);border-radius:16px;margin-bottom:22px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px;padding:8px 16px;border-top:1px solid rgba(255,255,255,.07)}
.row:first-child{border-top:0}
.row.dim{opacity:.4;pointer-events:none}
select,input[type=time]{font:inherit;font-size:16px;color:#fff;background:rgba(255,255,255,.1);border:0;border-radius:10px;padding:8px 10px;min-height:40px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border:0;border-radius:14px;font:500 16px Inter,system-ui,sans-serif;color:#fff;background:#0a84ff;margin-bottom:10px;cursor:pointer}
.btn.ghost{background:rgba(255,255,255,.1)}
.btn.danger{background:rgba(255,69,58,.16);color:#ff6961}
.switch{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:rgba(255,255,255,.22);position:relative;transition:background .2s;flex:none;cursor:pointer}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s}
.switch:checked{background:#30d158}
.switch:checked::after{transform:translateX(20px)}
:focus-visible{outline:2px solid #0a84ff;outline-offset:2px}
.toast{position:fixed;left:50%;top:max(24px,env(safe-area-inset-top));transform:translate(-50%,-16px);padding:12px 22px;border-radius:22px;background:rgba(28,28,32,.7);border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);opacity:0;transition:.35s;pointer-events:none;font-size:15px;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (orientation:portrait){.hud{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div class="stage" id="stage"><div class="empty"></div></div>
<div class="scrim"></div>
<div class="night"></div>

<div class="hint" id="hint" hidden>
  <strong>Seu porta-retrato está vazio</strong>
  Escolha as fotos que estão no tablet. Elas ficam guardadas aqui e você só faz isso uma vez.
  <br><button class="btn" id="hintAdd" type="button">Adicionar fotos</button>
</div>

<div class="hud">
  <div>
    <div class="date" id="date">&nbsp;</div>
    <div class="time" id="time">&nbsp;</div>
  </div>
  <div class="wx" id="wx" hidden></div>
</div>

<button class="gear" id="gear" type="button" aria-label="Ajustes">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
</button>

<aside class="sheet" id="sheet" aria-label="Ajustes do porta-retrato">
  <h2>Ajustes</h2>
  <p class="sub" id="count">Nenhuma foto guardada</p>

  <button class="btn" id="add" type="button">Adicionar fotos</button>
  <button class="btn ghost" id="fs" type="button">Tela cheia</button>
  <div style="height:12px"></div>

  <p class="cap">Exibição</p>
  <div class="grp">
    <div class="row"><label for="interval">Trocar a foto a cada</label>
      <select id="interval">
        <option value="15">15 segundos</option><option value="30">30 segundos</option><option value="60">1 minuto</option>
        <option value="120">2 minutos</option><option value="300">5 minutos</option><option value="600">10 minutos</option>
      </select></div>
    <div class="row"><label for="shuffle">Ordem aleatória</label><input class="switch" type="checkbox" id="shuffle"></div>
  </div>

  <p class="cap">Modo noturno escurece a tela no horário escolhido</p>
  <div class="grp">
    <div class="row"><label for="night">Modo noturno</label><input class="switch" type="checkbox" id="night"></div>
    <div class="row" id="rStart"><label for="nStart">Começa às</label><input type="time" id="nStart"></div>
    <div class="row" id="rEnd"><label for="nEnd">Termina às</label><input type="time" id="nEnd"></div>
  </div>

  <button class="btn danger" id="wipe" type="button">Apagar todas as fotos</button>
  <button class="btn ghost" id="close" type="button">Fechar</button>
</aside>

<input type="file" id="file" accept="image/*,.heic,.heif" multiple hidden>
<div class="toast" id="toast"></div>

<script>
{
const $ = s => document.querySelector(s);
const body = document.body, stage = $('#stage'), hint = $('#hint'), wx = $('#wx');

/* ajustes */
const DEF = {interval:60, shuffle:true, night:true, nStart:'23:00', nEnd:'06:30'};
let S = {...DEF};
try { S = {...DEF, ...JSON.parse(localStorage.getItem('pr-set') || '{}')}; } catch(e) {}
const save = () => { try { localStorage.setItem('pr-set', JSON.stringify(S)); } catch(e) {} };

/* banco de fotos no tablet */
let db = null;
const openDB = () => new Promise(r => {
  try {
    const q = indexedDB.open('porta-retrato', 1);
    q.onupgradeneeded = () => q.result.createObjectStore('fotos', {keyPath:'id', autoIncrement:true});
    q.onsuccess = () => r(q.result);
    q.onerror = () => r(null);
  } catch(e) { r(null); }
});
const store = mode => db.transaction('fotos', mode).objectStore('fotos');
const req = (fn, fallback) => new Promise(r => {
  if (!db) return r(fallback);
  try { const q = fn(); q.onsuccess = () => r(q.result); q.onerror = () => r(fallback); } catch(e) { r(fallback); }
});
const allKeys = () => req(() => store('readonly').getAllKeys(), []);
const getPhoto = id => req(() => store('readonly').get(id), null);
const addPhoto = rec => req(() => store('readwrite').add(rec), null);
const clearAll = () => req(() => store('readwrite').clear(), null);

/* fotos HEIC do iPhone viram JPEG aqui mesmo, o conversor só carrega quando aparece uma */
const isHeic = f => /\.(heic|heif)$/i.test(f.name || '') || /hei[cf]/i.test(f.type || '');
let heicLib = null;
const loadHeic = () => heicLib || (heicLib = new Promise((ok, no) => {
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';
  s.onload = () => window.heic2any ? ok(window.heic2any) : no();
  s.onerror = () => { heicLib = null; no(); };
  document.head.appendChild(s);
}));
async function decode(file) {
  try { return await createImageBitmap(file, {imageOrientation:'from-image'}); } catch(e) {}
  if (!isHeic(file)) return null;
  try {
    const conv = await loadHeic();
    const out = await conv({blob:file, toType:'image/jpeg', quality:.96});
    return await createImageBitmap(Array.isArray(out) ? out[0] : out);
  } catch(e) { return null; }
}

/* guarda cada foto cobrindo 1,5x a tela (1920 x 1200 vira 2880 x 1800), sobra para o corte e o zoom lento sem perder nitidez */
async function shrink(file) {
  const bmp = await decode(file);
  if (!bmp) return null;
  const k = Math.min(1, Math.max(2880 / bmp.width, 1800 / bmp.height));
  const w = Math.round(bmp.width * k), h = Math.round(bmp.height * k);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.drawImage(bmp, 0, 0, w, h);
  if (bmp.close) bmp.close();
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .94));
  return blob ? {blob, w, h} : null;
}

/* apresentação */
let keys = [], order = [], pos = 0, timer = null, cur = null;
function reorder() {
  order = [...keys];
  if (S.shuffle) for (let i = order.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [order[i], order[j]] = [order[j], order[i]]; }
  pos = 0;
}
async function show() {
  if (!keys.length) {
    if (cur) { cur.el.remove(); URL.revokeObjectURL(cur.url); cur = null; }
    hint.hidden = false; return;
  }
  hint.hidden = true;
  let rec = null;
  for (let t = 0; t < order.length && !rec; t++) { if (pos >= order.length) reorder(); rec = await getPhoto(order[pos++]); }
  if (!rec) return;
  const url = URL.createObjectURL(rec.blob);
  const el = document.createElement('div');
  el.className = 'slide';
  el.innerHTML = `<img alt="" src="${url}">`;
  const img = el.querySelector('img');
  /* foto em pé preenche a largura e o corte guarda a parte de cima, onde costumam estar os rostos */
  if ((rec.h / rec.w) > (innerHeight / innerWidth) * 1.15) img.style.objectPosition = '50% 30%';
  if (img.decode) await img.decode().catch(() => {});
  stage.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on')));
  const old = cur; cur = {el, url};
  if (old) setTimeout(() => { old.el.remove(); URL.revokeObjectURL(old.url); }, 2800);
}
function schedule() {
  clearTimeout(timer);
  timer = setTimeout(async () => { await show(); schedule(); }, S.interval * 1000);
}
async function reload() {
  keys = await allKeys();
  const n = keys.length;
  $('#count').textContent = !db ? 'O navegador não deixou guardar fotos aqui'
    : n ? `${n} ${n === 1 ? 'foto guardada' : 'fotos guardadas'} neste tablet` : 'Nenhuma foto guardada';
  reorder(); await show(); schedule();
}

/* relógio e data */
const fT = new Intl.DateTimeFormat('pt-BR', {hour:'2-digit', minute:'2-digit'});
const fD = new Intl.DateTimeFormat('pt-BR', {weekday:'long', day:'numeric', month:'long'});
const mins = s => { const [a, b] = (s || '0:0').split(':').map(Number); return a * 60 + b; };
let lastMin = -1;
function tick() {
  const d = new Date(), m = d.getHours() * 60 + d.getMinutes();
  if (m === lastMin) return;
  lastMin = m;
  $('#time').textContent = fT.format(d);
  const ds = fD.format(d);
  $('#date').textContent = ds.charAt(0).toUpperCase() + ds.slice(1);
  const a = mins(S.nStart), b = mins(S.nEnd);
  body.classList.toggle('is-night', S.night && (a < b ? (m >= a && m < b) : (m >= a || m < b)));
}

/* clima de Cuiabá */
const sv = p => `<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const cloud = (y = 0) => `<path d="M15 ${36 + y}h19a8 8 0 0 0 0-16 11 11 0 0 0-21 3 6.5 6.5 0 0 0 2 13z"/>`;
const rays = (cx, cy, r1, r2) => [0,45,90,135,180,225,270,315].map(g => { const t = g * Math.PI / 180; return `<line x1="${(cx + Math.cos(t) * r1).toFixed(1)}" y1="${(cy + Math.sin(t) * r1).toFixed(1)}" x2="${(cx + Math.cos(t) * r2).toFixed(1)}" y2="${(cy + Math.sin(t) * r2).toFixed(1)}"/>`; }).join('');
const ICON = {
  sun: sv(`<circle cx="24" cy="24" r="8"/>${rays(24, 24, 13, 18)}`),
  moon: sv(`<path d="M31 33a12 12 0 0 1-12-19 12 12 0 1 0 15 15 12 12 0 0 1-3 4z"/>`),
  partly: sv(`<circle cx="17" cy="17" r="6"/>${rays(17, 17, 9.5, 13)}${cloud(2)}`),
  cloud: sv(cloud()),
  fog: sv(`<line x1="10" y1="20" x2="38" y2="20"/><line x1="7" y1="27" x2="35" y2="27"/><line x1="12" y1="34" x2="40" y2="34"/>`),
  rain: sv(`${cloud(-5)}<line x1="18" y1="36" x2="15" y2="42"/><line x1="25" y1="36" x2="22" y2="42"/><line x1="32" y1="36" x2="29" y2="42"/>`),
  storm: sv(`${cloud(-5)}<path d="M26 33l-5 7h6l-4 6"/>`)
};
function describe(c) {
  if (c === 0) return ['Céu limpo', 'sun'];
  if (c === 1) return ['Predomínio de sol', 'sun'];
  if (c === 2) return ['Parcialmente nublado', 'partly'];
  if (c === 3) return ['Nublado', 'cloud'];
  if (c === 45 || c === 48) return ['Névoa', 'fog'];
  if (c >= 51 && c <= 57) return ['Garoa', 'rain'];
  if (c === 61 || c === 66) return ['Chuva fraca', 'rain'];
  if (c === 63) return ['Chuva', 'rain'];
  if (c === 65 || c === 67) return ['Chuva forte', 'rain'];
  if (c >= 80 && c <= 82) return ['Pancadas de chuva', 'rain'];
  if (c >= 95) return ['Tempestade', 'storm'];
  return ['Tempo instável', 'cloud'];
}
function paintWx(w) {
  const [label, ic] = describe(w.c);
  const icon = !w.d && ic === 'sun' ? 'moon' : !w.d && ic === 'partly' ? 'cloud' : ic;
  wx.innerHTML = `${ICON[icon]}<div><b>${w.t}°</b><small>${label}</small><small>Máx ${w.mx}°  Mín ${w.mn}°</small></div>`;
  wx.hidden = false;
}
async function weather() {
  try {
    const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-15.60&longitude=-56.10&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min&timezone=America%2FCuiaba&forecast_days=1');
    if (!r.ok) throw new Error('clima');
    const j = await r.json();
    const w = {t:Math.round(j.current.temperature_2m), c:j.current.weather_code, d:j.current.is_day,
      mx:Math.round(j.daily.temperature_2m_max[0]), mn:Math.round(j.daily.temperature_2m_min[0]), at:Date.now()};
    try { localStorage.setItem('pr-wx', JSON.stringify(w)); } catch(e) {}
    paintWx(w);
  } catch(e) {
    let c = null;
    try { c = JSON.parse(localStorage.getItem('pr-wx')); } catch(_) {}
    if (c && Date.now() - c.at < 6 * 3600e3) paintWx(c); else wx.hidden = true;
  }
}

/* tela sempre acesa */
let lock = null;
async function wake() {
  try {
    if ('wakeLock' in navigator && !lock) {
      lock = await navigator.wakeLock.request('screen');
      lock.addEventListener('release', () => { lock = null; });
    }
  } catch(e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { lastMin = -1; tick(); wake(); weather(); }
});

/* aviso rápido */
let tT;
function toast(msg, stay) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(tT); if (!stay) tT = setTimeout(() => t.classList.remove('on'), 2600);
}

/* toque mostra o botão de ajustes */
let uiT;
const openSheet = () => { body.classList.add('open'); body.classList.remove('show-ui'); };
const closeSheet = () => body.classList.remove('open');
document.addEventListener('pointerdown', e => {
  wake();
  if (e.target.closest('.sheet, .gear, .hint')) return;
  if (body.classList.contains('open')) { closeSheet(); return; }
  body.classList.add('show-ui');
  clearTimeout(uiT); uiT = setTimeout(() => body.classList.remove('show-ui'), 5000);
});
$('#gear').addEventListener('click', openSheet);
$('#close').addEventListener('click', closeSheet);
const pick = () => $('#file').click();
$('#add').addEventListener('click', pick);
$('#hintAdd').addEventListener('click', pick);
$('#fs').addEventListener('click', () => {
  const el = document.documentElement;
  try { const p = el.requestFullscreen ? el.requestFullscreen() : null; if (p && p.catch) p.catch(() => toast('Tela cheia não disponível aqui')); } catch(e) { toast('Tela cheia não disponível aqui'); }
  closeSheet();
});

$('#file').addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = '';
  if (!files.length) return;
  if (!db) { toast('O navegador não deixou guardar fotos aqui'); return; }
  let ok = 0;
  for (let i = 0; i < files.length; i++) {
    toast(`${isHeic(files[i]) ? 'Convertendo foto do iPhone' : 'Guardando'} ${i + 1} de ${files.length}`, true);
    const r = await shrink(files[i]);
    if (r && await addPhoto(r) != null) ok++;
  }
  toast(ok === 1 ? '1 foto adicionada' : `${ok} fotos adicionadas`);
  await reload();
});

let wipeArmed = false, wT;
$('#wipe').addEventListener('click', async () => {
  const b = $('#wipe');
  if (!wipeArmed) {
    wipeArmed = true; b.textContent = 'Toque de novo para apagar tudo';
    clearTimeout(wT); wT = setTimeout(() => { wipeArmed = false; b.textContent = 'Apagar todas as fotos'; }, 4000);
    return;
  }
  wipeArmed = false; b.textContent = 'Apagar todas as fotos';
  await clearAll(); toast('Fotos apagadas'); await reload();
});

/* liga os controles aos ajustes */
const iv = $('#interval'), sh = $('#shuffle'), nt = $('#night'), ns = $('#nStart'), ne = $('#nEnd');
const syncNight = () => { $('#rStart').classList.toggle('dim', !S.night); $('#rEnd').classList.toggle('dim', !S.night); };
iv.value = String(S.interval); sh.checked = S.shuffle; nt.checked = S.night; ns.value = S.nStart; ne.value = S.nEnd; syncNight();
iv.addEventListener('change', () => { S.interval = +iv.value; save(); schedule(); });
sh.addEventListener('change', () => { S.shuffle = sh.checked; save(); reorder(); });
nt.addEventListener('change', () => { S.night = nt.checked; save(); syncNight(); lastMin = -1; tick(); });
ns.addEventListener('change', () => { if (ns.value) { S.nStart = ns.value; save(); lastMin = -1; tick(); } });
ne.addEventListener('change', () => { if (ne.value) { S.nEnd = ne.value; save(); lastMin = -1; tick(); } });

/* início */
(async () => {
  tick(); setInterval(tick, 1000);
  weather(); setInterval(weather, 20 * 60e3);
  db = await openDB();
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch(e) {}
  await reload();
  wake();
})();
}
</script>
